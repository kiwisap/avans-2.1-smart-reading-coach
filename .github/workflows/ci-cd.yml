name: CI/CD

# Every push and pull request is checked. A push to the main branch is deployed to Azure
# after all checks are green. Make the "Build, lint and typecheck" and "Dependency scan" checks
# required in the branch protection rule, so a red pipeline blocks the merge.
on:
    pull_request:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
    IMAGE_NAME: smart-reading-coach

jobs:
    check:
        name: Build, lint and typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Build
              run: npm run build
              env:
                  VITE_API_URL: https://example.invalid/api

            # Catches a broken Dockerfile in a pull request, before it reaches the main branch.
            - name: Build the Docker image
              run: docker build --build-arg VITE_API_URL=https://example.invalid/api --tag "$IMAGE_NAME:check" .

    security:
        name: Dependency scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Fails the pipeline on a known high or critical vulnerability (all dependencies).
            # The scan reads package-lock.json, so nothing has to be installed.
            - name: npm audit
              run: npm audit --audit-level=high

    deploy:
        name: Deploy to Azure
        needs: [check, security]
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        environment: production
        permissions:
            id-token: write # lets the job sign in to Azure without a stored password
            contents: read
        env:
            ACR_NAME: ${{ vars.ACR_NAME }}
            RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
            APP_NAME: ${{ vars.WEB_APP_NAME }}
            API_APP_NAME: ${{ vars.API_APP_NAME }}
        steps:
            - uses: actions/checkout@v4

            - name: Sign in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Sign in to the container registry
              run: az acr login --name "$ACR_NAME"

            # The frontend needs the address of the API when it is built. It is asked from Azure,
            # so it never has to be written down here.
            - name: Find the API address
              run: |
                  API_FQDN=$(az containerapp show --name "$API_APP_NAME" --resource-group "$RESOURCE_GROUP" \
                      --query properties.configuration.ingress.fqdn --output tsv)
                  echo "VITE_API_URL=https://$API_FQDN/api" >> "$GITHUB_ENV"

            - name: Build and push the image
              run: |
                  IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
                  docker build --build-arg VITE_API_URL="$VITE_API_URL" \
                      --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
                  docker push "$IMAGE:${{ github.sha }}"
                  docker push "$IMAGE:latest"

            - name: Deploy the new revision
              run: |
                  az containerapp update \
                      --name "$APP_NAME" \
                      --resource-group "$RESOURCE_GROUP" \
                      --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

            - name: Smoke test
              run: |
                  FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                      --query properties.configuration.ingress.fqdn --output tsv)
                  echo "Checking https://$FQDN/"
                  curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
                      --output /dev/null "https://$FQDN/"
