# nginx settings for the single page app (React Router), used by the Dockerfile.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. add_header is not inherited by a location that sets its own add_header,
    # so the locations below only use "expires" (which sets Cache-Control) and no add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app only loads its own files. It may call the API on the default Azure address
    # (or localhost when you test the image locally). Change connect-src for a custom domain.
    # style-src needs 'unsafe-inline' because React and Bootstrap set style attributes.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.azurecontainerapps.io http://localhost:3000; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Files in /assets have a hash in their name, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Texts and the page itself must always be fresh, so an edit shows up right away.
    location /locales/ {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Every other address is a route of the app: React Router decides what to show.
    location / {
        try_files $uri /index.html;
    }
}
